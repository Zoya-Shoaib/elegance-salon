User Roles (Multi-User System): System mein 3 alag roles honge:
admin (Poore system ka access)
receptionist (Appointments, Clients aur Checkout)
stylist (Apna schedule aur tasks)
Secure Login & Redirect: User Email aur Password se login karega. Jab user login hoga, system uska Role check karega aur use uske specific dashboard par redirect karega:
Admin login kare ➡️ /admin-dashboard par redirect ho.
Receptionist login kare ➡️ /receptionist par redirect ho.
Stylist login kare ➡️ /stylist par redirect ho.
🛠️ Authentication Setup Ke 4 Steps (Pura Plan):



Step 1: Database Migration Mein role Column Lagana
Aapke users table migration (0001_01_01_000000_create_users_table.php) mein abhi role ka column nahi hai. Humein wahan ye line add karni hogi:

php
$table->string('role')->default('client'); // admin, receptionist, stylist
Step 2: User Model (User.php) Update Karna
app/Models/User.php mein $fillable array ke andar 'role' add karna hoga:

php
protected $fillable = ['name', 'email', 'password', 'role'];
Step 3: AuthController.php Mein Logic Likhna
Aapke AuthController.php mein hum Login aur Logout ka logic likhenge:

Login Method: Email aur Password verify karega.
Role Check: Check karega ke logged-in user Admin hai, Receptionist hai, ya Stylist hai, aur phir use uske dashboard par redirect karega.
Logout Method: Session clear karke wapas login screen par bhej dega.
Step 4: Middleware (Security Guard) Lagana
Isse koi unauthorized banda direct URL likh kar doosre role ka dashboard nahi khol sakega (e.g. Stylist agar /admin-dashboard likhega toh use access nahi milega).